[versions]
agp = "9.3.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-camera = "1.6.1"
androidx-lifecycle = "2.10.0"
coil = "3.4.0"
compose-material3 = "1.11.0-alpha07"
compose-multiplatform = "1.11.1"
koin = "4.2.2"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.9.0"
# KSP versioning is Kotlin-decoupled since 2.x (KSP2 / Analysis API).
ksp = "2.3.11"
ktor = "3.4.3"
navigation3 = "1.1.1"
room = "2.8.4"
# 2.10.5 matches the Tauri plugin exactly — its does-NOT-declare-dataSync
# manifest behavior is verified there; bump both together.
workmanager = "2.10.5"
zxing = "3.5.4"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-effects = { module = "androidx.camera:camera-effects", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
# 1.18+ requires compileSdk 37; 1.17.0 is the newest for compileSdk 36.
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.17.0" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
# androidx (not JetBrains) artifact — ProcessLifecycleOwner for the shared-kt
# upload manager's foreground check; same 2.10 stack as the KMP republishes.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
# The compose.* Gradle accessor aliases are deprecated since CMP 1.10 — libraries
# are declared directly here instead.
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
junit = { module = "junit:junit", version = "4.13.2" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# navigation3-runtime is androidx's own KMP artifact (Google Maven); the
# JetBrains group only republishes the ui layer for CMP.
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
# Closure for the shared-kt upload logic (see /shared-kt/README.md). okhttp
# is what the shared code uses directly (ktor-client-okhttp already pulls it
# in transitively); Room/WorkManager back PhotoDatabase + the upload worker.
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version = "1.9.4" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version = "1.9.4" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-rules = { module = "androidx.test:rules", version = "1.7.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
# Raster-tile map for the orientation view (P3). Deliberately boring: our tile
# palette is raster, and this is a plain AndroidView — the serious map-library
# evaluation is a later gate (see docs/frontend2-rewrite-plan.md).
osmdroid = { module = "org.osmdroid:osmdroid-android", version = "6.1.20" }
# Matches the Tauri plugin — shared-kt sensor family (FusedOrientationProvider,
# fused location).
play-services-location = { module = "com.google.android.gms:play-services-location", version = "21.3.0" }
# Native auth (CredentialGateway): the Credential Manager facade, its Play
# services password/passkey backend, and Google's ID-token credential type.
androidx-credentials = { module = "androidx.credentials:credentials", version = "1.5.0" }
androidx-credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version = "1.5.0" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version = "1.1.1" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Not used by the skeleton yet — pre-declared for the rewrite (HTTP client,
# JSON, image loading), matching what the official KMP template ships.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
