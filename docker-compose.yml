name: hillview

services:

  postgres:
    init: true
    # PostgreSQL 15.19 + PostGIS 3.5.7 on Alpine (pinned by digest, 2026-08-24 build).
    # docker-postgis deliberately builds its PG 14-17 Debian variants FROM
    # postgres:N-bullseye ("cautious release cycle"), but the official postgres
    # image stopped building bullseye in 2025-07 at 15.13 -- so 15-3.5 (Debian)
    # no longer receives PostgreSQL minor/security releases. Alternatives that
    # stay on Debian/glibc: postgis/postgis:18-3.6 (trixie, PG major bump) or an
    # own image FROM postgres:15-trixie + pgdg postgresql-15-postgis-3.
    # musl != glibc collation, so this image must NOT be started on a cluster
    # initialised by the old image -- hence the new volume name below and the
    # dump/restore procedure in docs/postgres-alpine-migration.md.
    #
    # PARKED 2026-08-25: prepared and rehearsed (backend/scripts/pg_rehearse_alpine.py
    # passed on the dev DB) but not switched on yet. To migrate, swap the four
    # commented lines in this service + umami-init + volumes: and follow the runbook.
    #image: postgis/postgis:15-3.5-alpine@sha256:22c05d317c2ffe76ebba2798a25eafaf764355c80faf5228c228de75346549a1
    image: postgis/postgis:15-3.5
    container_name: hillview_postgres
    mem_limit: 4g
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Locale per the official image docs ("Locale Customization",
      # https://hub.docker.com/_/postgres/): Alpine variants from Postgres 15 take
      # their collation from ICU. On musl the libc en_US collation is plain byte
      # order (A,B,a,b,z,é); ICU en-US sorts like glibc did (a,A,b,B,é,z) and does
      # not change under an OS/libc upgrade. Both are only consulted by initdb, i.e.
      # when the data volume is created; verified by backend/scripts/pg_rehearse_alpine.py.
      #LANG: en_US.utf8
      #POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
      # Removed POSTGRES_HOST_AUTH_METHOD: trust - use password auth instead
      # For initdb.d/create-panoramax-role.sh (fresh clusters only; empty =
      # skip). Existing clusters: backend/scripts/provision_panoramax_role.sh.
      PANORAMAX_DB_PASSWORD: ${PANORAMAX_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      #- postgres_data_15alpine:/var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5



  api:
    init: true
    restart: always
    build:
      context: backend
      dockerfile: api/app/Dockerfile
    container_name: hillview_api
    mem_limit: 3g
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - pics:/app/pics
      # GeoIP database dir for /api/featured/nearest — drop GeoLite2-City.mmdb here
      # (see backend/CLAUDE.md "Featured Photo GeoLite2 Database Setup"). Optional;
      # the endpoint falls back to the global best-annotated photo without it.
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${postgres:-postgres}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      #- REDIS_URL=redis://redis:6379/0
      - MAPILLARY_CLIENT_TOKEN_FILE=/run/secrets/mapillary_token
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - UPLOAD_DIR=/app/uploads
      - PICS_DIR=/app/pics
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Canonical public base URL for OAuth callbacks (set in prod, unset in dev — see .env.example)
      - API_BASE_URL=${API_BASE_URL:-}
      - ENABLE_MAPILLARY_CACHE=${ENABLE_MAPILLARY_CACHE:-true}
      - ENABLE_MAPILLARY_LIVE=${ENABLE_MAPILLARY_LIVE:-true}
      - ACTIVITY_SHOW_AUTHORIZED_PHOTOS=${ACTIVITY_SHOW_AUTHORIZED_PHOTOS:-false}
      - USER_ACCOUNTS=${USER_ACCOUNTS:-true}
      - TEST_USERS=${TEST_USERS:-false}
      - DEBUG_ENDPOINTS=${DEBUG_ENDPOINTS:-false}
      - MODULE_NAME=app.api
      - VARIABLE_NAME=app
      - HOST=0.0.0.0
      - PORT=8055
      - DEV_MODE=${DEV_MODE:-}
      - NO_LIMITS=${NO_LIMITS:-}
      - WORKER_URL=${WORKER_URL:-http://localhost:8056}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-157286400}
      - PICS_URL=${PICS_URL:-}
      # Storage pool registry (JSON). Unset => single-pool fallback from PICS_URL/PICS_DIR (+ CDN env). See backend/CLAUDE.md.
      - FILE_POOLS=${FILE_POOLS:-}
      - BUCKET_NAME=${BUCKET_NAME:-}
      - CDN_BASE_URL=${CDN_BASE_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-}
      #- FIREBASE_CONFIG=${FIREBASE_CONFIG:/run/secrets/firebase_config}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase_credentials
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
    command: >
      bash -c "cd /app/app && /app/prestart.sh && uvicorn api:app --host :: --port 8055 $${DEV_MODE:+--reload}"
    secrets:
      - mapillary_token
#      - firebase_config
      - firebase_credentials
    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    init: true
    restart: always
    build:
      # repo root: the web build imports shared/zoomview via the $zoomview
      # alias (see frontend/Dockerfile + its Dockerfile.dockerignore allowlist)
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hillview_frontend
    mem_limit: 2g
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - VITE_BACKEND=${VITE_BACKEND:-http://localhost:8055/api}
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - VITE_GOOGLE_REDIRECT_URI=${VITE_GOOGLE_REDIRECT_URI:-}
      - VITE_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - VITE_GITHUB_REDIRECT_URI=${VITE_GITHUB_REDIRECT_URI:-}
      - VITE_FEATURE_USER_ACCOUNTS=${USER_ACCOUNTS:-true}
      - VITE_DEV_MODE=${DEV_MODE:-false}
      - VITE_SENTRY_ENABLED=${VITE_SENTRY_ENABLED:-false}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
      - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID:-}
      - VITE_UMAMI_URL=${VITE_UMAMI_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started


  umami-init:
    # only needs psql; keep it on the same image as the postgres service so nothing
    # extra is pulled (alpine line parked together with the postgres service above)
    #image: postgis/postgis:15-3.5-alpine@sha256:22c05d317c2ffe76ebba2798a25eafaf764355c80faf5228c228de75346549a1
    image: postgis/postgis:15-3.5
    container_name: hillview_umami_init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U ${POSTGRES_USER} -d postgres -tc
        "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1 ||
        psql -h postgres -U ${POSTGRES_USER} -d postgres -c
        "CREATE DATABASE umami"


  umami:
    # umami 3.3.0 (pinned by digest; 3.x tags are plain "3.3.0" / "latest"). Bumped from
    # 3.1.0 on 2026-08-25 for GHSA-3xx8-742v-m4mq (cache token reusable as share token).
    image: ghcr.io/umami-software/umami@sha256:87312d334d009ee67ee0d2fba8fed01435547cc468e452243aef5133a9984d48
#    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: hillview_umami
    mem_limit: 1g
    restart: always
    ports:
      - "127.0.0.1:3344:3344"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-replace-me-with-a-real-secret}
      PORT: 3344
    depends_on:
      postgres:
        condition: service_healthy
      umami-init:
        condition: service_completed_successfully


  places:
    # Reverse-geocodes photos so they have a human-readable place_name instead of
    # a camera filename (which is what the /bestof and /photo/ headings — and the
    # anchor text pointing at them — fall back to today). Reuses the api image:
    # backfill_places.py lives in api/app and shares its deps, so no second build.
    # Opt-in via profile: docker compose --profile places up -d places
    #
    # NOMINATIM_URL must point at the self-hosted instance — the public OSM one
    # forbids bulk geocoding. Same variable name the enrichment workbench uses.
    build:
      context: backend
      dockerfile: api/app/Dockerfile
    container_name: hillview_places
    profiles: ["places"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${postgres:-postgres}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - NOMINATIM_URL=${NOMINATIM_URL:-https://nominatim.ueueeu.eu}
      # One pass per hour: the backlog drains at --delay, then each pass is a
      # cheap indexed query that finds only newly uploaded photos.
      - BACKFILL_PLACES_INTERVAL=${BACKFILL_PLACES_INTERVAL:-3600}
      # Interesting photos first — the scan is in upload order, and the headings
      # that are actually read (and linked from) belong to the annotated/titled few.
      - BACKFILL_PLACES_FILTER=${BACKFILL_PLACES_FILTER:-curated-first}
    command: >
      bash -c "cd /app/app && python3 backfill_places.py --delay $${GEOCODE_DELAY:-0.7}"
    depends_on:
      postgres:
        condition: service_healthy

  places-global:
    # Mops up what the self-hosted instance cannot answer: photos outside its
    # extract, which the max-km guard in reverse_geocode leaves marked as
    # out-of-coverage. BACKFILL_PLACES_RETRY_NO_PLACE makes this pass take those
    # rows and ONLY those — never-tried photos stay with the `places` service, so
    # the Czech backlog is never sent to a public endpoint.
    #
    # Runs against the public OSM Nominatim by default, whose usage policy binds
    # us on several axes at once. Because this loops (i.e. "run at regular
    # intervals") the policy's stricter branch applies: at most 4 requests per
    # minute, a single thread, and one machine — so run exactly one replica of
    # this service, never several. It also wants an identifying User-Agent
    # (backfill_places.py sends one) and results cached rather than re-queried
    # (a resolved row is written once and skipped forever after). The default
    # delay below is 300s, an order of magnitude under the 15s the 4/min rule
    # permits, because the work is a bounded tail of a few hundred photos with
    # nobody waiting on it.
    build:
      context: backend
      dockerfile: api/app/Dockerfile
    container_name: hillview_places_global
    profiles: ["places"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${postgres:-postgres}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - NOMINATIM_URL=${NOMINATIM_GLOBAL_URL:-https://nominatim.openstreetmap.org}
      - BACKFILL_PLACES_RETRY_NO_PLACE=true
      # Once a day: the set is bounded and shrinks to nothing, so a frequent
      # loop would only re-ask for rows that are genuinely unresolvable.
      - BACKFILL_PLACES_INTERVAL=${BACKFILL_PLACES_GLOBAL_INTERVAL:-86400}
    command: >
      bash -c "cd /app/app && python3 backfill_places.py --delay $${GEOCODE_GLOBAL_DELAY:-300}"
    depends_on:
      postgres:
        condition: service_healthy


  panoramax:
    # Panoramax/GeoVisio-compatible read API — Hillview's membership in the
    # Panoramax federation (see docs/panoramax-federation.md). Opt-in via
    # profile: docker compose --profile panoramax up -d --build panoramax
    # Runs as the panoramax_ro role (see docker/postgres/initdb.d/
    # create-panoramax-role.sh + backend/scripts/provision_panoramax_role.sh);
    # migration 030 must be applied (api prestart does it) — until then the
    # container waits, logging.
    init: true
    restart: always
    build:
      context: backend
      dockerfile: panoramax/Dockerfile
    container_name: hillview_panoramax
    mem_limit: 1g
    profiles: ["panoramax"]
    ports:
      - "127.0.0.1:8058:8058"
    environment:
      - DATABASE_URL=postgresql+asyncpg://panoramax_ro:${PANORAMAX_DB_PASSWORD:-}@${postgres:-postgres}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Public canonical base URL registered in the meta-catalog. Its last
      # characters must not be '/', 'a', 'p' or 'i' (the catalog rstrip("/api")s
      # the whole string); any *.hillview.cz host is safe.
      - PANORAMAX_BASE_URL=${PANORAMAX_BASE_URL:-http://localhost:8058}
      # Where "/" sends humans following the catalog's per-item rel=via link
      - PANORAMAX_VIEWER_URL=${PANORAMAX_VIEWER_URL:-https://hillview.cz}
      - PANORAMAX_INSTANCE_NAME=${PANORAMAX_INSTANCE_NAME:-Hillview}
      - PANORAMAX_SCOPE=${PANORAMAX_SCOPE:-cc}
      - PANORAMAX_SESSION_GAP_HOURS=${PANORAMAX_SESSION_GAP_HOURS:-3}
      - PANORAMAX_SEQUENCER_INTERVAL_S=${PANORAMAX_SEQUENCER_INTERVAL_S:-300}
      - PANORAMAX_SEQUENCER_ENABLED=${PANORAMAX_SEQUENCER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started


  analyzer:
    # LLM photo analyzer (production component; previously a manually-run script).
    # Opt-in via profile: docker compose --profile analyzer up -d --build analyzer
    build:
      context: .
      dockerfile: scripts/analyzer/Dockerfile
    container_name: hillview_analyzer
    profiles: ["analyzer"]
    restart: unless-stopped
    # OOM guard: the analyzer is light (httpx + sqlalchemy, images stay remote),
    # but a leak in a long-running LLM loop shouldn't be able to take the box
    mem_limit: 1g
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - ANALYZER_DATA_DIR=/data
      - ANALYZER_FETCH_IMAGES=${ANALYZER_FETCH_IMAGES:-false}
    command: ["python", "analyzer.py", "--verbose", "--model", "${ANALYZER_MODEL:-nvidia/nemotron-nano-12b-v2-vl:free}"]
    volumes:
      - analyzer_data:/data
    secrets:
      - openrouter_api_key
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  # glibc cluster from the Debian postgis image. When the parked alpine migration
  # happens, postgres_data_15alpine takes over and this one stays as the rollback
  # target until proven; then delete it here and `docker volume rm hillview_postgres_data`.
  postgres_data:
  #postgres_data_15alpine:
  uploads:
  analyzer_data:
  # NB: the `pics` volume is intentionally NOT defined here. The api service
  # mounts it, so base alone is an invalid project ("undefined volume pics").
  # An environment overlay (docker-compose.dev.yml / .prod.yml) must define it,
  # which forces every launch to select an environment.


secrets:
  mapillary_token:
      file: ./secrets/MAPILLARY_CLIENT_TOKEN
  firebase_config:
      file: ./secrets/FIREBASE_CONFIG.json
  firebase_credentials:
      file: ./secrets/firebase_credentials
  openrouter_api_key:
      file: ./scripts/analyzer/secrets/OPENROUTER_API_KEY


networks:
  default:
    name: hillview_network
