[project]
name = "hillview-tests"
version = "1.0.0"
description = "Hillview integration tests"
requires-python = ">=3.12"

dependencies = [
    # Shared utilities (JWT, crypto, DB access)
    "hillview-common[db,auth]",

    # Test framework
    "pytest==9.0.3",
    "pytest-asyncio>=1.0,<2",

    # HTTP clients
    "httpx",
    "aiohttp",
    "requests",

    # Image generation for test photos
    "pillow",
    "piexif",

    # STAC validation in the Panoramax federation E2E (panoramax/scripts/e2e_federation.py).
    # 1.15 splits into pystac-core plus ~25 extension packages; 1.14 validates the same.
    "pystac[validation]~=1.14.3",
]

[tool.uv.sources]
hillview-common = { workspace = true }
