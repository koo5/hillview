[project]
name = "hillview-backend"
version = "1.0.0"
description = "Hillview backend workspace"
requires-python = ">=3.12"

[tool.uv]
# Dependency cooloff: resolution ignores distributions uploaded after this
# date. Advance it deliberately when refreshing deps -- `scripts/deps.py backend`
# does that and the upgrade in one go; a plain `uv lock` with a different value
# re-resolves the whole lockfile from scratch. CVE-fix versions younger than
# this need `--exclude-newer-package pkg=DATE` (`deps.py backend --young pkg`).
exclude-newer = "2026-08-11T00:00:00Z"

# Targeted security fixes. Keep the existing cutoff for unrelated packages.
# Pillow and certifi fixes need explicit exceptions to the cooloff.
# Persist these dates so plain `uv lock` / `uv sync` keeps the same policy.
constraint-dependencies = [
    "pillow>=13.0.0",  # GHSA-8g5g-8vmr-9782: JPEG decoder heap overflow
    "fsspec>=2026.6.0",  # GHSA-27vj-qcqg-25rc: reference filesystem SSTI
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",  # compromised root CAs; explicit young-fix exception
    "multidict>=6.9.1",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
    "mako>=1.4.2",  # GHSA-5639-2j2p-m4mx: Windows template path traversal
]

[tool.uv.exclude-newer-package]
pillow = "2026-10-17T00:00:00Z"
mako = "2026-09-23T00:00:00Z"
aiohttp = "2026-10-06T00:00:00Z"
certifi = "2026-10-21T00:00:00Z"
multidict = "2026-09-22T00:00:00Z"
pyjwt = "2026-09-24T00:00:00Z"
urllib3 = "2026-09-16T00:00:00Z"
yarl = "2026-09-16T00:00:00Z"
[tool.uv.workspace]
members = ["common", "api/app", "worker", "tests", "panoramax"]

[tool.ruff]
exclude = [
    "*/alembic/versions/*",
    "**/venv/**",
    "**/.venv/**",
]
